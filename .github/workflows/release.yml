name: 'Release'
on:
  push:
    branches:
      - 'release'
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

# Uses only the built-in GITHUB_TOKEN to cut a release on a push to the
# `release` branch: this bumps the version, then creates the v<version> release.
permissions:
  contents: write

jobs:
  release:
    name: 'Bump version and create release'
    runs-on: ubuntu-latest
    steps:
      - name: 'Check out release branch'
        uses: actions/checkout@v7
        with:
          ref: release
          fetch-depth: 0
      - name: 'Configure git identity'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
      - name: 'Bump version, commit, push, and create release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          ./package/version.sh bump
          ./package/version.sh sub
          VERSION="v$(cat package/version)"
          git commit --all --message "Set Version: ${VERSION}"
          git push origin HEAD:release
          gh release create "${VERSION}"              \
            --repo runtimeverification/evm-semantics  \
            --title "${VERSION}"                       \
            --target "$(git rev-parse HEAD)"
