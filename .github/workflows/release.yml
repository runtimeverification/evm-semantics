name: 'Release'
on:
  push:
    branches:
      - 'release'
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

# Uses only the auto-issued, per-run GITHUB_TOKEN (no stored secrets); every
# other permission scope is implicitly dropped to none. Runs only on push to
# the trusted `release` branch and executes only in-repo scripts (version.sh,
# gh) -- never untrusted PR code -- so the write-scoped token is never exposed
# to third-party code. The Nix/Cachix binary caches and docs are published
# outside GitHub Actions. A release is cut by pushing the `release` branch
# manually (e.g. merging master into it); this workflow then bumps the version,
# commits it back to `release`, and creates the `v<version>` tag + release.
permissions:
  contents: write

jobs:
  release:
    name: 'Bump version and create release'
    runs-on: ubuntu-latest
    steps:
      - name: 'Check out release branch'
        uses: actions/checkout@v7
        with:
          ref: release
          fetch-depth: 0
      - name: 'Configure git identity'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
      - name: 'Bump version, commit, push, and create release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          ./package/version.sh bump
          ./package/version.sh sub
          VERSION="v$(cat package/version)"
          git commit --all --message "Set Version: ${VERSION}"
          git push origin HEAD:release
          gh release create "${VERSION}"              \
            --repo runtimeverification/evm-semantics  \
            --title "${VERSION}"                       \
            --target "$(git rev-parse HEAD)"
